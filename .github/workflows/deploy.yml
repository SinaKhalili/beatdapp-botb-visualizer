name: Deploy

# Auto-deploy on every push to main (and manually via the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys; let the newest push win.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Deploys Convex backend to prod, builds the frontend against the prod
      # Convex URL, and uploads the Cloudflare Worker. Secrets come from the
      # repo's Actions secrets (never committed).
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
